name: Build Gustaxy Android (ZIP)



on:

  push:
  
    branches: [ main ]
    
  pull_request:
  
    branches: [ main ]
    
  workflow_dispatch:
  


permissions:

  contents: read
  


jobs:

  build:
  
    name: Extract ZIP and assemble debug APK
    
    runs-on: ubuntu-latest
    


    steps:
    
      - name: Checkout repository
      
        uses: actions/checkout@v4
        


      - name: Extract Android project ZIP
      
        run: |
        
          test -f gustaxy-android.zip
          
          rm -rf build-project
          
          mkdir -p build-project
          
          unzip -q gustaxy-android.zip -d build-project
          
          test -f build-project/settings.gradle.kts
          
          test -f build-project/gradlew
          
          chmod +x build-project/gradlew
          


      - name: Set up Java 17
      
        uses: actions/setup-java@v4
        
        with:
        
          distribution: temurin
          
          java-version: '17'
          
          cache: gradle
          
          cache-dependency-path: build-project/**/*.gradle*
          


      - name: Set up Android SDK
      
        uses: android-actions/setup-android@v3
        


      - name: Install Android SDK packages
      
        run: |
        
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          


      - name: Build debug APK from ZIP contents
      
        working-directory: build-project
        
        run: ./gradlew :app:assembleDebug --stacktrace
        


      - name: Upload debug APK
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: gustaxy-android-debug-apk
          
          path: build-project/app/build/outputs/apk/debug/app-debug.apk
          
          if-no-files-found: error
          










































