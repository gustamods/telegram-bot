name: Gustaxy validation and release



on:

  push:
  
    branches: [ main ]
    
  pull_request:
  
    branches: [ main ]
    
  workflow_dispatch:
  


permissions:

  contents: read
  


jobs:

  php-check:
  
    name: Validate PHP server package
    
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Checkout repository
      
        uses: actions/checkout@v4
        
      - name: Set up PHP
      
        uses: shivammathur/setup-php@v2
        
        with:
        
          php-version: '8.3'
          
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring
          
          coverage: none
          
      - name: Lint PHP files
      
        run: |
        
          test -f gustaxy-server.zip
          
          rm -rf server-check
          
          mkdir server-check
          
          unzip -q gustaxy-server.zip -d server-check
          
          find server-check -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          
          test -f server-check/database/database.sql
          


  android-release:
  
    name: Build signed optimized Android release
    
    if: github.event_name != 'pull_request'
    
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Checkout repository
      
        uses: actions/checkout@v4
        


      - name: Extract Android project ZIP
      
        run: |
        
          test -f gustaxy-android.zip
          
          rm -rf build-project
          
          mkdir -p build-project
          
          unzip -q gustaxy-android.zip -d build-project
          
          test -f build-project/settings.gradle.kts
          
          test -f build-project/gradlew
          
          chmod +x build-project/gradlew
          


      - name: Set up Java 17
      
        uses: actions/setup-java@v4
        
        with:
        
          distribution: temurin
          
          java-version: '17'
          
          cache: gradle
          
          cache-dependency-path: build-project/**/*.gradle*
          


      - name: Set up Android SDK
      
        uses: android-actions/setup-android@v3
        


      - name: Install Android SDK and NDK packages
      
        run: |
        
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.3.11579264"
          


      - name: Restore release keystore
      
        env:
        
          KEYSTORE_B64: ${{ secrets.GUSTAXY_KEYSTORE_B64 }}
          
        run: |
        
          test -n "$KEYSTORE_B64"
          
          printf '%s' "$KEYSTORE_B64" | base64 --decode > build-project/gustaxy-release.jks
          
          chmod 600 build-project/gustaxy-release.jks
          


      - name: Build signed optimized release
      
        working-directory: build-project
        
        env:
        
          GUSTAXY_API_BASE_URL: ${{ secrets.GUSTAXY_API_BASE_URL }}
          
          GUSTAXY_CERT_SHA256: ${{ secrets.GUSTAXY_CERT_SHA256 }}
          
          GUSTAXY_KEYSTORE_PATH: gustaxy-release.jks
          
          GUSTAXY_KEYSTORE_PASSWORD: ${{ secrets.GUSTAXY_KEYSTORE_PASSWORD }}
          
          GUSTAXY_KEY_ALIAS: ${{ secrets.GUSTAXY_KEY_ALIAS }}
          
          GUSTAXY_KEY_PASSWORD: ${{ secrets.GUSTAXY_KEY_PASSWORD }}
          
        run: ./gradlew :app:assembleRelease --stacktrace
        


      - name: Verify APK signing schemes
      
        working-directory: build-project
        
        run: |
        
          APK=app/build/outputs/apk/release/app-release.apk
          
          test -s "$APK"
          
          apksigner verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          
          grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/apksigner.txt
          
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt
          
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/apksigner.txt
          
          sha256sum "$APK" | tee app/build/outputs/apk/release/app-release.apk.sha256
          


      - name: Remove private material
      
        if: always()
        
        run: rm -f build-project/gustaxy-release.jks
        


      - name: Upload optimized release APK and mapping
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: gustaxy-android-release
          
          path: |
          
            build-project/app/build/outputs/apk/release/app-release.apk
            
            build-project/app/build/outputs/apk/release/app-release.apk.sha256
            
            build-project/app/build/outputs/mapping/release/mapping.txt
            
          if-no-files-found: error
          





























































































